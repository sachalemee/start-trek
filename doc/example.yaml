algo: dqn # dqn or qlearn

env: {
  ### Mandatory ###
  run_mode: TRAIN, # TRAIN, EVAL
  model: dqn,
  nb_loop: 1000,
  max_episode_steps: 1000,
  enable_wind: False,
  wind_power: 0.0,
  turbulence_power: 0.0,
  render_mode: RECORD, # HUMAN, RECORD, NONE

  ### Mandatory for RECORD render_mode ###
  trigger_video: 10,

  ### Mandatory for trainning ###
  mean: 210, #  Mean to success criteria
  mean_steps: 100, # on n (here '100') steps

  ### Optional for Train ###
  load: True
}

hyper: {
  epsilon_start: 1.0,
  epsilon_end: 0.05,
  epsilon_decay: 0.995,
  discount: 0.99,
  lr: 0.0001,

  ### Mandatory for dqn algo ###
  batchsize: 64,
  memory_capacity: 50000,
  target_update: 1000,

  ### Optional for q-learning discretization ###
  discretisation: {
    bins: [5, 5, 20, 20, 15, 20, 2, 2],
    zoom: 1.0
  }
}

seed: 67
