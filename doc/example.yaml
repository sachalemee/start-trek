algo: dqn # dqn or qlearn

env: {
  ### Mandatory ###
  run_mode: TRAIN, # TRAIN, EVAL
  model: dqn_model,
  nb_loop: 10000,
  max_episode_steps: 500,
  enable_wind: False,
  wind_power: 0.0,
  turbulence_power: 0.0,
  render_mode: RECORD, # HUMAN, RECORD, NONE

  ### Mandatory for RECORD render_mode ###
  trigger_video: 100,

  ### Optional for Train ###
  load: TRUE,
}

hyper: {
  epsilon_start: 1.0,
  epsilon_end: 0.0,
  epsilon_decay: 0.995,
  discount: 0.99,
  lr: 0.0001,

  ### Mandatory for dqn algo ###
  batchsize: 64,
  memory_capacity: 10000,
}

seed: 67